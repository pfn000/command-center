name: avatar-v3 probe
# Jena avatar run 9b pose probe: QA sweep (neck+chest rings + 360 seam close-ups) for several proof-pose arm angles. Private inputs/outputs (HF).
on:
  push:
    branches: [avatar-v3]
    paths: [avatar-v3/PROBE.txt]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix: { variant: [P55, P55s3, P50, P45, P45s3] }
    env: { VARIANT: "${{ matrix.variant }}", QA: sweep, QA_SHARD: "0", QA_SHARDS: "1", QA_RINGS: "3,4", QA_CLOSE: "1" }
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.4
        run: |
          curl -sL -o /tmp/b.tar.xz https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
      - name: Inputs (private, no Meshy)
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          pip install -q huggingface_hub pillow numpy > /dev/null
          python3 -c "
          import os; from huggingface_hub import snapshot_download
          p=snapshot_download('Saidie000/jena-avatar-assets',repo_type='dataset',token=os.environ['HF'],local_dir='/tmp/in',ignore_patterns=['avatar-v3/*','*Meshy*','*.glb','*Normal_OpenGL.png','*Normal.png','*Height.png'])
          print(p)"
          cd /tmp/in && for z in *.zip; do unzip -o -q "$z" || true; done; mkdir -p /tmp/out/proof
      - name: Blender QA
        run: |
          timeout -k 10 3250 /opt/blender/blender -b --factory-startup --python-exit-code 3 --python avatar-v3/assemble.py -- /tmp/in /tmp/out > /tmp/out/qa-log.txt 2>&1 || echo "BLENDER EXIT $?"
          grep -E "^\[v3\] (EYES|chain|QA|still 0|rigqa frame)|Error|Traceback" /tmp/out/qa-log.txt | cut -c1-300 | tail -60 || true
      - name: Upload QA (private)
        if: always()
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          rm -rf /tmp/out/proof/skinmatch-cal-* ; du -sh /tmp/out
          python3 -c "
          import os; from huggingface_hub import HfApi
          HfApi(token=os.environ['HF']).upload_folder(folder_path='/tmp/out',path_in_repo='avatar-v3/runs/'+os.environ['GITHUB_RUN_ID']+'/probe-'+os.environ['VARIANT'],repo_id='Saidie000/jena-avatar-assets',repo_type='dataset'); print('uploaded')"
