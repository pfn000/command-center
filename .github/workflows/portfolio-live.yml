name: portfolio prod check
# Shoots Saidie's LIVE production portfolio (public URL) at 1600 and 390; commits only the shots + report back.
on:
  push:
    branches: [portfolio-live]
    paths: [portfolio-live/RUN.txt]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Shoot
        shell: bash
        run: |
          read -r url rest < portfolio-live/RUN.txt
          mkdir -p /tmp/pw && cp portfolio-live/shot-prod.mjs /tmp/pw/
          (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null && (npx playwright install chrome >/dev/null 2>&1 || true))
          rm -rf portfolio-live/out && mkdir -p portfolio-live/out
          for r in / /work /emmico /worlds /writing /resume /about /companies /plex /this-page-does-not-exist; do echo "$r $(curl -s -o /dev/null -w '%{http_code} %{size_download}' "$url$r")" >> portfolio-live/out/curl.txt; done
          timeout -k 10 900 node /tmp/pw/shot-prod.mjs "$url" portfolio-live/out 2>&1 | tee portfolio-live/out/log.txt
      - name: Commit shots back
        if: always()
        run: |
          git config user.name "tab-proof"; git config user.email "tab-proof@users.noreply.github.com"
          git add portfolio-live/out || true
          git commit -m "portfolio prod check ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
