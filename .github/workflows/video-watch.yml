name: video-watch
run-name: "${{ github.event.head_commit.message }}"
on:
  push:
    branches: [video-watch]
    paths: ["video-watch/jobs/**"]
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: video-watch/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/vw-models
          key: vw-models-v1
      - name: Install
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q -U -r video-watch/requirements.txt
          ffmpeg -version | head -1; yt-dlp --version
      - name: Watch
        env:
          HF_TOKEN: ${{ secrets.VW_HF_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          JOB=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- video-watch/jobs | head -1)
          echo "job file: $JOB"; cat "$JOB"
          VW_JOB="$JOB" python -u video-watch/watch.py 2>&1 | tee watch-log.txt
      - name: Publish log
        if: always()
        env:
          HF_TOKEN: ${{ secrets.VW_HF_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          JOB=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- video-watch/jobs | head -1)
          VW_JOB="$JOB" python - <<'PY'
          import os, json
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"]); req = json.load(open(os.environ["VW_JOB"]))["req"]
          if os.path.exists("watch-log.txt"):
              api.upload_file(path_or_fileobj="watch-log.txt", path_in_repo="live/" + req + "/runner-log.txt", repo_id="Saidie000/tab-render-out", repo_type="dataset")
          print("log published")
          PY
