name: portfolio-v2 proof shots
# Proof shots for Saidie's portfolio-v2 branch (her portfolio repo is private and its Vercel previews sit
# behind Vercel login). The source rides here only as AES-256 ciphertext; the key is a repo secret.
# The runner decrypts, builds it exactly like Vercel (next build), serves it and takes headless Chromium
# screenshots at 1600x900 and 402x874. Only the screenshots are committed back.
on:
  push:
    branches: [portfolio-shots]
    paths: [portfolio-shots/RUN.txt]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Decrypt + build
        shell: bash
        env: { K: "${{ secrets.PORTFOLIO_PROOF_KEY }}" }
        run: |
          mkdir -p /tmp/site
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in <(cat portfolio-shots/src.tgz.enc.part*) | tar -xz -C /tmp/site
          cd /tmp/site && corepack enable && corepack prepare pnpm@9 --activate
          pnpm install --no-frozen-lockfile 2>&1 | tail -5
          pnpm build 2>&1 | tee /tmp/build.log | tail -60
      - name: Serve + shoot
        run: |
          (cd /tmp/site && pnpm start -p 3000 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 1; done
          mkdir -p /tmp/pw && cp portfolio-shots/shot.mjs /tmp/pw/
          (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null)
          rm -rf portfolio-shots/out && mkdir -p portfolio-shots/out
          node /tmp/pw/shot.mjs http://localhost:3000 portfolio-shots/out 2>&1 | tee portfolio-shots/out/log.txt
      - name: Commit shots back
        if: always()
        run: |
          mkdir -p portfolio-shots/out
          [ -f /tmp/build.log ] && grep -v -i -E "secret|token|key=" /tmp/build.log | tail -120 > portfolio-shots/out/build-tail.log
          git config user.name "tab-proof"; git config user.email "tab-proof@users.noreply.github.com"
          git add portfolio-shots/out
          git commit -m "portfolio-v2 proof shots ${{ github.run_id }}" || exit 0
          git push
