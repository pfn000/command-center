name: avatar-v3 build
# Jena avatar v3 (Saidie's own rigged assets). Purchased inputs come from her PRIVATE HF dataset via a repo secret;
# outputs go to her private dataset. No asset is committed to this public repo.
on:
  push:
    branches: [avatar-v3]
    paths: [avatar-v3/RUN.txt]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.4
        run: |
          curl -sL -o /tmp/b.tar.xz https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          /opt/blender/blender --version | head -1
      - name: Inputs (private)
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          pip install -q huggingface_hub pillow numpy > /dev/null
          python3 -c "
          import os; from huggingface_hub import snapshot_download
          p=snapshot_download('Saidie000/jena-avatar-assets',repo_type='dataset',token=os.environ['HF'],local_dir='/tmp/in',ignore_patterns=['avatar-v3/*','*Normal_OpenGL.png','*Normal.png','*Height.png'])
          print(p)"
          cd /tmp/in && for z in *.zip; do unzip -o -q "$z" || true; done; ls -la /tmp/in /tmp/in/assets; mkdir -p /tmp/out/proof
      - name: Blender
        if: always()
        run: |
          MODE=$(head -1 avatar-v3/RUN.txt | cut -d' ' -f1)
          timeout -k 10 1100 /opt/blender/blender -b --factory-startup --python-exit-code 3 --python avatar-v3/$MODE.py -- /tmp/in /tmp/out > /tmp/out/blender-log.txt 2>&1 || echo "BLENDER EXIT $?"
          grep -E "^\[v3\]|Error|Traceback|line [0-9]+" /tmp/out/blender-log.txt | cut -c1-400 | head -250 || true
      - name: Compose proofs
        if: always()
        run: |
          [ -f avatar-v3/compose.py ] && python3 avatar-v3/compose.py /tmp/in /tmp/out || true
      - name: Upload outputs (private)
        if: always()
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          ls -laR /tmp/out | head -80
          python3 - <<'EOF'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF']).upload_folder(folder_path='/tmp/out', path_in_repo='avatar-v3/runs/' + os.environ['GITHUB_RUN_ID'],
              repo_id='Saidie000/jena-avatar-assets', repo_type='dataset')
          print('uploaded')
          EOF

  turntable:
    if: contains(github.event.head_commit.message, '[tt]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.4
        run: |
          curl -sL -o /tmp/b.tar.xz https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          /opt/blender/blender --version | head -1
      - name: Inputs (private)
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          pip install -q huggingface_hub pillow numpy > /dev/null
          python3 -c "
          import os; from huggingface_hub import snapshot_download
          p=snapshot_download('Saidie000/jena-avatar-assets',repo_type='dataset',token=os.environ['HF'],local_dir='/tmp/in',ignore_patterns=['avatar-v3/*','*Normal_OpenGL.png','*Normal.png','*Height.png'])
          print(p)"
          cd /tmp/in && for z in *.zip; do unzip -o -q "$z" || true; done; ls -la /tmp/in /tmp/in/assets; mkdir -p /tmp/out/proof
      - name: Frames
        env: { TT_SHARD: "${{ matrix.shard }}", TT_SHARDS: "4" }
        run: |
          timeout -k 10 2400 /opt/blender/blender -b --factory-startup --python-exit-code 3 --python avatar-v3/build.py -- /tmp/in /tmp/out > /tmp/out/tt-log.txt 2>&1 || echo "BLENDER EXIT $?"
          grep -E "^\[v3\] frame|Error|Traceback" /tmp/out/tt-log.txt | tail -40; ls /tmp/out/frames | wc -l
      - uses: actions/upload-artifact@v4
        with: { name: "frames-${{ matrix.shard }}", path: /tmp/out/frames, retention-days: 2 }
  assemble:
    needs: turntable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "frames-*", path: /tmp/frames, merge-multiple: true }
      - name: MP4
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ls /tmp/frames | wc -l; mkdir -p /tmp/o
          ffmpeg -loglevel error -y -framerate 12 -i /tmp/frames/f%03d.png -vf "fps=24,format=yuv420p" -c:v libx264 -preset slow -crf 22 -movflags +faststart /tmp/o/jena-v3-turntable.mp4
          ls -la /tmp/o; pip install -q huggingface_hub > /dev/null
          python3 -c "
          import os; from huggingface_hub import HfApi
          HfApi(token=os.environ['HF']).upload_folder(folder_path='/tmp/o',path_in_repo='avatar-v3/runs/'+os.environ['GITHUB_RUN_ID'],repo_id='Saidie000/jena-avatar-assets',repo_type='dataset'); print('uploaded')"
