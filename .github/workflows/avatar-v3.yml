name: avatar-v3 build
# Jena avatar v3.7 (Saidie's own assets ONLY; zero Meshy). Inputs come from her PRIVATE HF dataset via a repo secret;
# outputs go to her private dataset. No asset is committed to this public repo.
on:
  push:
    branches: [avatar-v3]
    paths: [avatar-v3/RUN.txt]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix: { variant: [A0, A2] }
    env: { VARIANT: "${{ matrix.variant }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.4
        run: |
          curl -sL -o /tmp/b.tar.xz https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 fonts-dejavu-core > /dev/null
          /opt/blender/blender --version | head -1
      - name: Inputs (private, no Meshy)
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          MODE=$(head -1 avatar-v3/RUN.txt | cut -d' ' -f1)
          pip install -q huggingface_hub pillow numpy > /dev/null
          python3 -c "
          import os; from huggingface_hub import snapshot_download
          ig=['avatar-v3/*','*Meshy*','*.glb']+([] if '$MODE'=='assets' else ['*Normal_OpenGL.png','*Normal.png','*Height.png'])
          p=snapshot_download('Saidie000/jena-avatar-assets',repo_type='dataset',token=os.environ['HF'],local_dir='/tmp/in',ignore_patterns=ig)
          print(p)"
          cd /tmp/in && for z in *.zip; do unzip -o -q "$z" || true; done; ls -la /tmp/in /tmp/in/assets; mkdir -p /tmp/out/proof
          find /tmp/in -iname '*meshy*' | head; echo "meshy files present: $(find /tmp/in -iname '*meshy*' | wc -l)"
      - name: Blender
        if: always()
        run: |
          MODE=$(head -1 avatar-v3/RUN.txt | cut -d' ' -f1)
          export AS_ONLY="$(sed -n 2p avatar-v3/RUN.txt)"
          timeout -k 10 2700 /opt/blender/blender -b --factory-startup --python-exit-code 3 --python avatar-v3/$MODE.py -- /tmp/in /tmp/out > /tmp/out/blender-log.txt 2>&1 || echo "BLENDER EXIT $?"
          grep -E "^\[v3\]|Error|Traceback|line [0-9]+" /tmp/out/blender-log.txt | cut -c1-400 | head -300 || true
      - name: Compose proofs
        if: always()
        run: |
          export AS_ONLY="$(sed -n 2p avatar-v3/RUN.txt)"
          [ -f avatar-v3/compose.py ] && python3 avatar-v3/compose.py /tmp/in /tmp/out || true
      - name: Upload outputs (private)
        if: always()
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          ls -laR /tmp/out | head -120
          python3 - <<'EOF'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF']).upload_folder(folder_path='/tmp/out', path_in_repo='avatar-v3/runs/' + os.environ['GITHUB_RUN_ID'] + '/' + os.environ['VARIANT'],
              repo_id='Saidie000/jena-avatar-assets', repo_type='dataset')
          print('uploaded')
          EOF

  turntable:
    if: contains(github.event.head_commit.message, '[tt]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.4
        run: |
          curl -sL -o /tmp/b.tar.xz https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
      - name: Inputs (private, no Meshy)
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          pip install -q huggingface_hub pillow numpy > /dev/null
          python3 -c "
          import os; from huggingface_hub import snapshot_download
          p=snapshot_download('Saidie000/jena-avatar-assets',repo_type='dataset',token=os.environ['HF'],local_dir='/tmp/in',ignore_patterns=['avatar-v3/*','*Meshy*','*.glb','*Normal_OpenGL.png','*Normal.png','*Height.png'])
          print(p)"
          cd /tmp/in && for z in *.zip; do unzip -o -q "$z" || true; done; mkdir -p /tmp/out/proof
      - name: Frames
        env: { TT_SHARD: "${{ matrix.shard }}", TT_SHARDS: "4" }
        run: |
          export VARIANT=$(head -1 avatar-v3/RUN.txt | cut -d' ' -f2); echo "VARIANT=$VARIANT"
          timeout -k 10 2700 /opt/blender/blender -b --factory-startup --python-exit-code 3 --python avatar-v3/assemble.py -- /tmp/in /tmp/out > /tmp/out/tt-log.txt 2>&1 || echo "BLENDER EXIT $?"
          grep -E "^\[v3\] frame|Error|Traceback" /tmp/out/tt-log.txt | tail -40; ls /tmp/out/frames | wc -l
      - uses: actions/upload-artifact@v4
        with: { name: "frames-${{ matrix.shard }}", path: /tmp/out/frames, retention-days: 2 }
  assemble:
    needs: turntable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "frames-*", path: /tmp/frames, merge-multiple: true }
      - name: MP4
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ls /tmp/frames | wc -l; mkdir -p /tmp/o
          ffmpeg -loglevel error -y -framerate 12 -i /tmp/frames/f%03d.png -vf "fps=24,format=yuv420p" -c:v libx264 -preset slow -crf 22 -movflags +faststart /tmp/o/jena-v3-turntable.mp4
          ls -la /tmp/o; pip install -q huggingface_hub > /dev/null
          python3 -c "
          import os; from huggingface_hub import HfApi
          HfApi(token=os.environ['HF']).upload_folder(folder_path='/tmp/o',path_in_repo='avatar-v3/runs/'+os.environ['GITHUB_RUN_ID'],repo_id='Saidie000/jena-avatar-assets',repo_type='dataset'); print('uploaded')"

  qa:
    # run 6 QA gates (Saidie 12:48-12:51): helical 360 sweep (shirt on: shards 0-3, shirt off: shards 4-5) and the rig motion test (shards 6-9)
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        include:
          - { qa: sweep, variant: A0, shard: 0, shards: 4 }
          - { qa: sweep, variant: A0, shard: 1, shards: 4 }
          - { qa: sweep, variant: A0, shard: 2, shards: 4 }
          - { qa: sweep, variant: A0, shard: 3, shards: 4 }
          - { qa: sweep, variant: A2, shard: 0, shards: 2 }
          - { qa: sweep, variant: A2, shard: 1, shards: 2 }
          - { qa: rigqa, variant: A0, shard: 0, shards: 4 }
          - { qa: rigqa, variant: A0, shard: 1, shards: 4 }
          - { qa: rigqa, variant: A0, shard: 2, shards: 4 }
          - { qa: rigqa, variant: A0, shard: 3, shards: 4 }
    env: { VARIANT: "${{ matrix.variant }}", QA: "${{ matrix.qa }}", QA_SHARD: "${{ matrix.shard }}", QA_SHARDS: "${{ matrix.shards }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.4
        run: |
          curl -sL -o /tmp/b.tar.xz https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz
          mkdir -p /opt/blender && tar -xf /tmp/b.tar.xz -C /opt/blender --strip-components=1 && rm /tmp/b.tar.xz
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
      - name: Inputs (private, no Meshy)
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          pip install -q huggingface_hub pillow numpy > /dev/null
          python3 -c "
          import os; from huggingface_hub import snapshot_download
          p=snapshot_download('Saidie000/jena-avatar-assets',repo_type='dataset',token=os.environ['HF'],local_dir='/tmp/in',ignore_patterns=['avatar-v3/*','*Meshy*','*.glb','*Normal_OpenGL.png','*Normal.png','*Height.png'])
          print(p)"
          cd /tmp/in && for z in *.zip; do unzip -o -q "$z" || true; done; mkdir -p /tmp/out/proof
      - name: Blender QA
        run: |
          timeout -k 10 3000 /opt/blender/blender -b --factory-startup --python-exit-code 3 --python avatar-v3/assemble.py -- /tmp/in /tmp/out > /tmp/out/qa-log.txt 2>&1 || echo "BLENDER EXIT $?"
          grep -E "^\[v3\] (EYES|chain|QA|still 0|rigqa frame)|Error|Traceback" /tmp/out/qa-log.txt | cut -c1-300 | tail -60 || true
      - name: Upload QA (private)
        if: always()
        env: { HF: "${{ secrets.AV2_HF_TOKEN }}" }
        run: |
          rm -rf /tmp/out/proof/skinmatch-cal-* ; du -sh /tmp/out
          python3 -c "
          import os; from huggingface_hub import HfApi
          HfApi(token=os.environ['HF']).upload_folder(folder_path='/tmp/out',path_in_repo='avatar-v3/runs/'+os.environ['GITHUB_RUN_ID']+'/qa-'+os.environ['QA']+'-'+os.environ['VARIANT']+'-'+os.environ['QA_SHARD'],repo_id='Saidie000/jena-avatar-assets',repo_type='dataset'); print('uploaded')"
